<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kejutan Ulang Tahun</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d1030;--bg2:#3a1850;--gold:#ffb627;--pink:#ff5d8f;--mint:#7ae7c7;--ink:#fff4e6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(120% 90% at 50% 100%,var(--bg2),var(--bg) 70%) fixed;color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow-x:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#stars{z-index:0}#fx{z-index:50}
.scene{position:relative;z-index:1;min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 20px}
.scene.on{display:flex}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0 0 .4em;line-height:1.1}
h1{font-size:clamp(2.4rem,9vw,4.6rem)}h2{font-size:clamp(1.7rem,6vw,2.6rem)}
p{max-width:34ch;line-height:1.55;margin:.4em auto}
.btn{font:700 1.05rem Nunito,sans-serif;border:0;border-radius:99px;padding:.85em 1.6em;margin-top:1.2em;background:var(--gold);color:#2a1238;cursor:pointer;box-shadow:0 6px 0 #b07a00;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #b07a00}
.btn:focus-visible,.cd:focus-visible,.lan:focus-visible,input:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
input{font:600 1.3rem Fraunces,serif;text-align:center;background:transparent;color:var(--ink);border:0;border-bottom:3px dashed var(--pink);padding:.4em;width:min(80vw,320px)}
input::placeholder{color:#ffffff66}
.hint{opacity:.75;font-size:.95rem;min-height:1.5em}
/* cake */
.cake{width:min(86vw,340px);overflow:visible}
.cd{cursor:pointer}
.fl{transform-origin:50% 100%;transform-box:fill-box;animation:fl .5s ease-in-out infinite alternate}
@keyframes fl{to{transform:scale(1.15,.9) rotate(4deg)}}
.cd .fl{opacity:0;transition:opacity .2s}.cd.lit .fl{opacity:1}
.cd:not(.lit){animation:tap 1.4s infinite}@keyframes tap{50%{transform:translateY(-3px)}}
.smoke{opacity:0}.out .smoke{animation:sm 1.6s ease-out}
@keyframes sm{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
/* lanterns */
.sky{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 14px;max-width:560px;margin-top:10px}
.lan{width:84px;height:110px;border:0;background:none;cursor:pointer;position:relative;animation:bob 3.4s ease-in-out infinite;padding:0}
.lan:nth-child(2n){animation-delay:-1.2s}.lan:nth-child(3n){animation-delay:-2.2s}
@keyframes bob{50%{transform:translateY(-12px)}}
.lan i{position:absolute;inset:0 0 14px;border-radius:46% 46% 38% 38%;background:var(--c);box-shadow:0 0 34px var(--c),inset 0 -14px 22px #0003;transition:transform .4s}
.lan b{position:absolute;left:50%;bottom:0;width:30px;height:14px;margin-left:-15px;background:#5a3410;border-radius:3px}
.lan.open i{transform:scale(1.12);filter:brightness(1.25)}
.lan.open{animation-play-state:paused}
#msg{min-height:7.5em;font-family:Fraunces,serif;font-style:italic;font-size:1.3rem;max-width:26ch;margin-top:22px}
/* letter */
.paper{background:#fff4e6;color:#3a1850;border-radius:6px 22px 6px 22px;padding:28px 26px;max-width:460px;width:100%;text-align:left;box-shadow:0 18px 50px #0007;transform:rotate(-1.2deg)}
#typed{font-family:Fraunces,serif;font-size:1.12rem;line-height:1.7;white-space:pre-wrap;min-height:16em}
.caret::after{content:"▍";animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.big{font-size:5rem;animation:hb 1s infinite}@keyframes hb{50%{transform:scale(1.15)}}
.flip{animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}@keyframes pop{from{transform:scale(.3);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="stars"></canvas><canvas id="fx"></canvas>

<section class="scene on" id="s0">
  <div class="big" aria-hidden="true">🎁</div>
  <h1>Khusus buat Latuly</h1>
  <p>Ada kejutan kecil buat kamu. Nggak ada orang lain yang dapet yang ini, cuma kamu.</p>
  <button class="btn" id="go">Buka kadonya</button>
</section>

<section class="scene" id="s1">
  <h2 id="t1">Nyalain lilinnya yuk</h2>
  <p class="hint" id="h1">Tap tiap lilin untuk menyalakannya</p>
  <svg class="cake" id="cake" viewBox="0 0 300 260" role="img" aria-label="Kue ulang tahun dengan tiga lilin">
    <ellipse cx="150" cy="238" rx="135" ry="14" fill="#0004"/>
    <rect x="35" y="150" width="230" height="84" rx="14" fill="#ff8fb1"/>
    <rect x="55" y="104" width="190" height="56" rx="12" fill="#ffd1e0"/>
    <path d="M55 120q14 22 28 0t28 0 28 0 28 0 28 0 22 14v-24q0-6-6-6H61q-6 0-6 6z" fill="#fff4e6"/>
    <path d="M35 166q14 22 28 0t28 0 28 0 28 0 28 0 28 0 28 0 11 10v-22H35z" fill="#fff4e6"/>
    <circle cx="80" cy="200" r="7" fill="#ffb627"/><circle cx="150" cy="208" r="7" fill="#7ae7c7"/><circle cx="220" cy="200" r="7" fill="#ffb627"/>
    <g class="cd" tabindex="0" role="button" aria-label="Lilin 1" data-x="95"><rect x="89" y="68" width="12" height="40" rx="3" fill="#7ae7c7"/><path class="fl" d="M95 36c10 12 9 22 0 28-9-6-10-16 0-28z" fill="#ffb627"/><path class="smoke" d="M95 60q-8-10 0-18" stroke="#fff8" stroke-width="3" fill="none"/></g>
    <g class="cd" tabindex="0" role="button" aria-label="Lilin 2" data-x="150"><rect x="144" y="58" width="12" height="46" rx="3" fill="#ff5d8f"/><path class="fl" d="M150 26c10 12 9 22 0 28-9-6-10-16 0-28z" fill="#ffb627"/><path class="smoke" d="M150 50q-8-10 0-18" stroke="#fff8" stroke-width="3" fill="none"/></g>
    <g class="cd" tabindex="0" role="button" aria-label="Lilin 3" data-x="205"><rect x="199" y="68" width="12" height="40" rx="3" fill="#ffb627"/><path class="fl" d="M205 36c10 12 9 22 0 28-9-6-10-16 0-28z" fill="#ffb627"/><path class="smoke" d="M205 60q-8-10 0-18" stroke="#fff8" stroke-width="3" fill="none"/></g>
  </svg>
  <button class="btn" id="blow" style="display:none">Make a wish, lalu tiup</button>
  <button class="btn" id="n1" style="display:none">Lanjut</button>
</section>

<section class="scene" id="s2">
  <h2 id="t2">Lampion harapan</h2>
  <p class="hint">Tap semua lampion untuk membaca isinya</p>
  <div class="sky" id="sky"></div>
  <div id="msg" aria-live="polite"></div>
  <button class="btn" id="n2" style="display:none">Satu lagi nih</button>
</section>

<section class="scene" id="s3">
  <div class="paper"><div id="typed" class="caret"></div></div>
  <button class="btn" id="end" style="display:none">Yang terakhir</button>
</section>

<section class="scene" id="s4">
  <div class="big" aria-hidden="true">🎉</div>
  <h1 id="fin">Selamat ulang tahun</h1>
  <p>Semoga harinya seru dan banyak yang traktir. Hehe.</p>
  <button class="btn" id="again">Ulangi kejutannya</button>
</section>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let NAME="Latuly";
// Ganti teks di bawah ini supaya lebih personal
const WISHES=[
 ["#ffb627","Ketawa kamu tuh nular. Ada kamu, suasana langsung rame."],
 ["#ff5d8f","Semoga tahun ini kamu dikelilingi orang-orang baik dan hal-hal yang bikin seneng."],
 ["#7ae7c7","Semoga target dan rencana yang kamu simpan satu-satu bisa kesampaian."],
 ["#b58cff","Kamu emang cantik, tapi yang bikin orang betah deket kamu itu karena kamu asik."],
 ["#ff9248","Makasih ya udah jadi temen yang asik. Semoga kita makin sering nongkrong bareng."]
];
const LETTER=n=>`Hai ${n},

Selamat ulang tahun! Ini kado kecil dari aku, nggak mahal tapi dibuat sendiri hehe.

Kamu tuh orangnya ceria dan lucu, nongkrong sama kamu nggak pernah ngebosenin.

Semoga umur baru ini lancar terus, banyak rezeki, banyak hal seru, dan yang kamu pengenin satu-satu kesampaian. Kalau butuh temen cerita, kabarin aja ya.

Sekali lagi, selamat ulang tahun ${n}! Traktirannya jangan lupa ya 😆`;

/* background stars */
const sc=$('#stars'),sx=sc.getContext('2d');let stars=[];
function rs(){sc.width=innerWidth;sc.height=innerHeight;stars=Array.from({length:90},()=>({x:Math.random()*sc.width,y:Math.random()*sc.height,r:Math.random()*1.6+.3,p:Math.random()*6}))}
rs();addEventListener('resize',rs);
(function tw(t){sx.clearRect(0,0,sc.width,sc.height);stars.forEach(s=>{sx.globalAlpha=.35+.5*Math.abs(Math.sin(t/900+s.p));sx.fillStyle='#fff4e6';sx.beginPath();sx.arc(s.x,s.y,s.r,0,7);sx.fill()});requestAnimationFrame(tw)})(0);

/* confetti */
const fc=$('#fx'),fx=fc.getContext('2d');let bits=[],run=false;
function fit(){fc.width=innerWidth;fc.height=innerHeight}fit();addEventListener('resize',fit);
function burst(x=innerWidth/2,y=innerHeight*.45,n=140){
  const cols=['#ffb627','#ff5d8f','#7ae7c7','#b58cff','#fff4e6'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=Math.random()*11+4;bits.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6,w:Math.random()*9+5,h:Math.random()*5+3,c:cols[i%5],r:Math.random()*6,vr:Math.random()*.4-.2,l:1})}
  if(!run){run=true;loop()}
}
function loop(){fx.clearRect(0,0,fc.width,fc.height);bits=bits.filter(b=>b.l>0&&b.y<fc.height+20);
  bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.28;b.vx*=.99;b.r+=b.vr;b.l-=.004;fx.save();fx.globalAlpha=Math.min(1,b.l*2);fx.translate(b.x,b.y);fx.rotate(b.r);fx.fillStyle=b.c;fx.fillRect(-b.w/2,-b.h/2,b.w,b.h);fx.restore()});
  bits.length?requestAnimationFrame(loop):(run=false,fx.clearRect(0,0,fc.width,fc.height))}

function show(id){$$('.scene').forEach(s=>s.classList.toggle('on',s.id===id));scrollTo(0,0)}

/* scene 0 */
function start(){
  $('#t1').textContent=`${NAME}, nyalain lilinnya yuk`;burst(innerWidth/2,innerHeight/2,90);show('s1')}
$('#go').onclick=start;

/* scene 1 */
let lit=0;
$$('.cd').forEach(c=>{const f=()=>{if(c.classList.contains('lit'))return;c.classList.add('lit');lit++;
  const r=c.getBoundingClientRect();burst(r.left+r.width/2,r.top,14);
  if(lit===1)$('#h1').textContent='Bagus, tinggal sisanya';
  if(lit===3){$('#h1').textContent='Pejamkan mata, bikin permohonan dalam hati';$('#blow').style.display='inline-block'}};
  c.onclick=f;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}}});
$('#blow').onclick=()=>{$('#cake').classList.add('out');$$('.cd').forEach(c=>c.classList.remove('lit'));
  $('#blow').style.display='none';$('#t1').textContent=`Happy Birthday, ${NAME}!`;$('#h1').textContent='Semoga permohonanmu terkabul';
  burst(innerWidth/2,innerHeight*.4,220);setTimeout(()=>burst(innerWidth*.2,innerHeight*.5,90),350);setTimeout(()=>burst(innerWidth*.8,innerHeight*.5,90),600);
  $('#n1').style.display='inline-block'};
$('#n1').onclick=()=>show('s2');

/* scene 2 */
let seen=new Set();
WISHES.forEach(([c,t],i)=>{const b=document.createElement('button');b.className='lan';b.setAttribute('aria-label','Lampion '+(i+1));b.style.setProperty('--c',c);b.innerHTML='<i></i><b></b>';
  b.onclick=()=>{b.classList.add('open');seen.add(i);const m=$('#msg');m.textContent=t;m.classList.remove('flip');void m.offsetWidth;m.classList.add('flip');
    const r=b.getBoundingClientRect();burst(r.left+42,r.top+40,26);if(seen.size===WISHES.length)setTimeout(()=>$('#n2').style.display='inline-block',900)};
  $('#sky').append(b)});
$('#n2').onclick=()=>{show('s3');type()};

/* scene 3 */
let timer;
function type(){const el=$('#typed'),txt=LETTER(NAME);let i=0;el.textContent='';el.classList.add('caret');$('#end').style.display='none';clearInterval(timer);
  timer=setInterval(()=>{el.textContent=txt.slice(0,++i);if(i>=txt.length){clearInterval(timer);el.classList.remove('caret');$('#end').style.display='inline-block'}},32)}
$('#end').onclick=()=>{$('#fin').textContent=`Selamat ulang tahun, ${NAME}`;show('s4');
  [0,300,650,1000].forEach(d=>setTimeout(()=>burst(Math.random()*innerWidth,innerHeight*.35,120),d))};
$('#again').onclick=()=>{lit=0;seen.clear();$$('.lan').forEach(l=>l.classList.remove('open'));$('#msg').textContent='';
  $('#n2').style.display=$('#n1').style.display='none';$('#cake').classList.remove('out');$('#h1').textContent='Tap tiap lilin untuk menyalakannya';show('s0')};
</script>
</body>
</html>
